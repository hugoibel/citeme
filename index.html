<!DOCTYPE html>
<html lang="en">
<head>

<title>CiteMe · Does AI recommend your business?</title>

<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#0f1729; --ink-soft:#5a6478; --line:#e4e7ee;
  --brand:#1b5cff; --brand-soft:#eaf0ff; --ok:#0a9d63; --ok-soft:#e6f6ef;
  --warn:#c98200; --warn-soft:#fdf3e0; --bad:#d5304a; --bad-soft:#fdecef;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.05),0 12px 32px -12px rgba(16,24,40,.14);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b0f17;--panel:#131a26;--ink:#eef2f8;--ink-soft:#99a4b8;--line:#243044;
  --brand:#5b8cff;--brand-soft:#16233f;--ok:#3ad294;--ok-soft:#0f2a20;--warn:#f0b445;--warn-soft:#2b2213;
  --bad:#ff6b83;--bad-soft:#2d1620;--shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.7);}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--brand)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:19px}
.logo .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--brand),#8a5bff);display:grid;place-items:center}
.top-r{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-size:13px;font-weight:650;padding:8px 11px;cursor:pointer}
.lang button.on{background:var(--brand);color:#fff}
.btn{border:1px solid transparent;border-radius:12px;padding:12px 18px;font-weight:650;font-size:15px;cursor:pointer;
  font-family:inherit;transition:.15s transform,.15s box-shadow,.15s background}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px -8px rgba(27,92,255,.8)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-soft)}
.hero{padding:38px 0 10px;max-width:770px}
.kicker{display:inline-flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand);
  font-weight:650;font-size:13px;padding:6px 12px;border-radius:999px;margin-bottom:18px}
h1{font-size:clamp(30px,5.2vw,50px);line-height:1.06;letter-spacing:-.035em;margin:0 0 16px;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(180deg,transparent 62%,rgba(27,92,255,.22) 62%);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .06em}
.sub{font-size:clamp(16px,2.2vw,19px);color:var(--ink-soft);margin:0;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:1 1 210px}
.stat b{font-size:19px;letter-spacing:-.02em}
.stat span{display:block;font-size:12.5px;color:var(--ink-soft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.form{margin:26px 0 40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:650;color:var(--ink-soft);margin:0 0 6px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--bg);
  color:var(--ink);font:inherit;font-size:15px;outline:0;transition:.15s border-color,.15s box-shadow}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.row-actions{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--ink-soft)}
.hint code{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
#progress{display:none;margin:0 0 40px}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:14px 0 10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#8a5bff);transition:width .4s}
.log{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);max-height:150px;overflow:auto;white-space:pre-wrap}
#result{display:none;margin-bottom:60px}
.score-head{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.gauge{position:relative;width:150px;height:150px;flex:0 0 auto}
.gauge svg{transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .val b{font-size:40px;letter-spacing:-.04em;line-height:1}
.gauge .val span{font-size:12px;color:var(--ink-soft);display:block}
.verdict{flex:1;min-width:260px}
.verdict h2{margin:0 0 6px;font-size:24px;letter-spacing:-.025em}
.verdict p{margin:0;color:var(--ink-soft)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-ok{background:var(--ok-soft);color:var(--ok)}
section.block{margin-top:26px}
section.block h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);margin:0 0 12px;font-weight:700}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
   padding:0 10px 8px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-no{background:var(--bad-soft);color:var(--bad)} .p-si{background:var(--ok-soft);color:var(--ok)}
.q{font-weight:600}
.who{color:var(--ink-soft);font-size:13px;margin-top:3px}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{width:26px;height:26px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:0 0 auto}
.rank .nm{flex:1;font-weight:600}
.rank .ct{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.srcs{display:flex;flex-wrap:wrap;gap:8px}
.src{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;display:flex;gap:7px;align-items:center}
.src b{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-weight:600;font-size:12px}
ol.plan{margin:0;padding:0;list-style:none;counter-reset:p}
ol.plan li{counter-increment:p;position:relative;padding:0 0 16px 42px;margin-bottom:16px;border-bottom:1px solid var(--line)}
ol.plan li:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
ol.plan li::before{content:counter(p);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:9px;
  background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
ol.plan b{display:block;margin-bottom:3px}
ol.plan span{color:var(--ink-soft);font-size:14.5px}
.cta{margin-top:28px;background:linear-gradient(140deg,var(--brand),#8a5bff);color:#fff;border-radius:var(--radius);padding:26px}
.cta h3{color:#fff;text-transform:none;letter-spacing:-.02em;font-size:21px;margin:0 0 6px}
.cta p{margin:0 0 16px;opacity:.92;font-size:15px;max-width:60ch}
.cta .btn{background:#fff;color:#1b2a4a}
.cta .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.cta .btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff}
.planes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
@media(max-width:640px){.planes{grid-template-columns:1fr}}
.plan-c{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;position:relative}
.plan-c.destacado{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.plan-c .et{position:absolute;top:-11px;right:16px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.plan-c h4{margin:0 0 2px;font-size:17px;letter-spacing:-.02em}
.plan-c .precio{font-size:32px;font-weight:800;letter-spacing:-.04em;margin:8px 0 2px}
.plan-c .precio small{font-size:14px;font-weight:600;color:var(--ink-soft);letter-spacing:0}
.plan-c ul{margin:12px 0 18px;padding:0;list-style:none;font-size:14.5px;color:var(--ink-soft)}
.plan-c li{padding:4px 0 4px 22px;position:relative}
.plan-c li::before{content:'✓';position:absolute;left:0;color:var(--ok);font-weight:800}
.plan-c .btn{width:100%}
footer{border-top:1px solid var(--line);padding:26px 0 50px;color:var(--ink-soft);font-size:13.5px}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);
  padding:24px;max-width:520px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(6,10,18,.55);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
dialog p{margin:0 0 16px;color:var(--ink-soft);font-size:14px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:11px;padding:12px 14px;font-size:14px;margin-top:14px;display:none}
@media print{
  body{background:#fff;color:#000}
  header.top,.hero,.form,#progress,.cta,.planes,footer,.noprint{display:none!important}
  #result{display:block!important}
  .card{box-shadow:none;border:1px solid #ddd}
  section.block{break-inside:avoid}
}
</style>
</head>

/* ─────────── utilidades ─────────── */
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/\b(s\.?l\.?u?|s\.?a\.?|inc|llc|corp|co|ltd)\b/g,'')
  .replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim();
const STOP = new Set(['de','la','el','los','las','del','y','en','the','and','of','for','centro','clinica','clinic','center','shop','store','bar','grill','group','services','llc','inc']);
const tokens = s => norm(s).split(' ').filter(w => w.length>2 && !STOP.has(w));
function mencionado(texto, nombre){
  const x = norm(texto), tk = tokens(nombre);
  if(!tk.length) return false;
  if(x.includes(norm(nombre))) return true;
  const hits = tk.filter(w => x.includes(w)).length;
  return tk.length===1 ? hits===1 : hits >= Math.max(2, Math.ceil(tk.length*0.7));
}
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function log(m){ const l=$('#pLog'); l.textContent += m+'\n'; l.scrollTop = l.scrollHeight; }
const progreso = (a,b) => $('#pBar').style.width = Math.round(a/b*100)+'%';
function fallo(m){ const e=$('#err'); e.innerHTML = m; e.style.display='block'; }

/* ─────────── llamada a la IA (backend o clave local) ─────────── */
async function ia(prompt, {buscar=false, json=false} = {}){
  if(BACKEND){
    const r = await fetch(BACKEND.replace(/\/$/,'') + '/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ prompt, buscar, json })
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || `backend ${r.status}`);
    return { texto:d.texto||'', fuentes:d.fuentes||[] };
  }
  const model = CFG.model || 'gemini-2.5-flash';
  const body = { contents:[{ role:'user', parts:[{text:prompt}] }] };
  if(buscar) body.tools = [{ google_search:{} }];
  else if(json) body.generationConfig = { responseMimeType:'application/json', temperature:0 };
  const r = await fetch(`${API}/models/${model}:generateContent?key=${encodeURIComponent(CFG.key)}`,{
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if(!r.ok) throw new Error(`API ${r.status}: ${(await r.text().catch(()=>'')).slice(0,180)}`);
  const d = await r.json(), c = d.candidates && d.candidates[0];
  return {
    texto:(c?.content?.parts||[]).map(p=>p.text).filter(Boolean).join('\n').trim(),
    fuentes:(c?.groundingMetadata?.groundingChunks||[]).map(g=>g.web&&(g.web.domain||g.web.title)).filter(Boolean)
  };
}
function parseJSON(txt){
  if(!txt) return null;
  const s = txt.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  try{ return JSON.parse(s); }catch(_){}
  const m = s.match(/[\[{][\s\S]*[\]}]/);
  if(m){ try{ return JSON.parse(m[0]); }catch(_){} }
  return null;
}
async function detectarModelos(){
  const r = await fetch(`${API}/models?key=${encodeURIComponent(CFG.key)}&pageSize=200`);
  if(!r.ok) throw new Error('Cannot list models ('+r.status+')');
  const d = await r.json();
  const ok = (d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m=>m.name.replace('models/','')).filter(n=>!/embedding|aqa|image|tts|vision|live|native-audio/i.test(n));
  const pref = n => (/flash/.test(n)?0:1) + (/lite/.test(n)?.5:0) + (/preview|exp/.test(n)?2:0);
  return ok.sort((a,b)=>pref(a)-pref(b) || b.localeCompare(a));
}

/* ─────────── análisis ─────────── */
const IDIOMA = () => CFG.lang==='es' ? 'Spanish' : 'English';

async function generarPreguntas(neg, n){
  const p = `You are a customer in ${neg.ciudad} (United States) looking for "${neg.actividad}".
Write ${n} realistic, varied questions you would type into ChatGPT to find that service.
Mix: general recommendation, "best", urgent/emergency, price, best reviewed, near me, one specific specialty, one comparison.
NEVER mention any brand or company name. Every question must include the city.
Write them in ${IDIOMA()}. Return ONLY a JSON array of ${n} strings.`;
  const { texto } = await ia(p, {json:true});
  const arr = parseJSON(texto);
  if(Array.isArray(arr) && arr.length) return arr.slice(0,n).map(String);
  const base = CFG.lang==='es'
    ? [`mejores ${neg.actividad} en ${neg.ciudad}`, `¿qué ${neg.actividad} me recomiendas en ${neg.ciudad}?`,
       `${neg.actividad} baratos en ${neg.ciudad}`, `${neg.actividad} de urgencia en ${neg.ciudad}`]
    : [`best ${neg.actividad} in ${neg.ciudad}`, `which ${neg.actividad} do you recommend in ${neg.ciudad}?`,
       `affordable ${neg.actividad} in ${neg.ciudad}`, `emergency ${neg.actividad} in ${neg.ciudad}`];
  return base.slice(0,n);
}

async function extraerNegocios(respuesta, neg){
  const p = `From this text, extract ONLY the specific business names being recommended, in the order they appear (ignore generic categories, directories and websites).
Text:
"""${respuesta.slice(0,6000)}"""
Return JSON: {"negocios":["..."],"objetivo":true|false,"posicion":n|null} where "objetivo" says whether "${neg.nombre}" is among them and "posicion" is its rank (1 = first).`;
  const { texto } = await ia(p, {json:true});
  const j = parseJSON(texto) || {};
  const lista = Array.isArray(j.negocios) ? j.negocios.map(String) : [];
  let objetivo = !!j.objetivo, pos = Number(j.posicion)||null;
  const i = lista.findIndex(x => mencionado(x, neg.nombre));
  if(i>=0){ objetivo = true; pos = i+1; }
  else if(!objetivo && mencionado(respuesta, neg.nombre)){ objetivo = true; pos = pos || lista.length+1; }
  return { lista, objetivo, pos };
}

const PUNTOS = p => p===1?100 : p===2?80 : p===3?65 : p<=5?50 : 35;

async function analizar(neg, nPreg){
  $('#form').style.display='none'; $('#progress').style.display='block';
  $('#pLog').textContent=''; progreso(0,1);
  $('#pTitle').textContent = `${t('analizando')} "${neg.nombre}" · ${neg.ciudad}…`;
  log(t('gen'));
  const preguntas = await generarPreguntas(neg, nPreg);
  log(`  ${preguntas.length} ${t('listas')}\n`);

  const filas=[], comp=new Map(), fuentes=new Map();
  let hechas=0;
  for(const q of preguntas){
    try{
      const { texto, fuentes:fs } = await ia(
        `${q}\n\n(Answer like a real assistant helping a user: recommend SPECIFIC businesses by name, the ones you actually find for that city. Reply in ${IDIOMA()}.)`,
        {buscar:true});
      const { lista, objetivo, pos } = await extraerNegocios(texto, neg);
      filas.push({ q, objetivo, pos, lista });
      lista.forEach((n,i)=>{
        if(mencionado(n, neg.nombre)) return;
        const k=n.trim().replace(/\s+/g,' ');
        const p=comp.get(k)||{n:k,veces:0,puntos:0}; p.veces++; p.puntos+=PUNTOS(i+1); comp.set(k,p);
      });
      fs.forEach(f => { const d=String(f).replace(/^www\./,'').toLowerCase(); fuentes.set(d,(fuentes.get(d)||0)+1); });
      log(`${objetivo?t('cita'):t('nocita')} · ${q.slice(0,68)}`);
    }catch(e){ log(`⚠️  ${t('errq')} "${q.slice(0,38)}…": ${e.message}`); }
    progreso(++hechas, preguntas.length);
  }
  if(!filas.length) throw new Error(t('sinDatos'));

  const citas = filas.filter(f=>f.objetivo).length;
  const score = Math.round(filas.reduce((a,f)=>a+(f.objetivo?PUNTOS(f.pos||6):0),0)/filas.length);
  $('#progress').style.display='none';
  pintar({ neg, filas, score, citas,
    rivales:[...comp.values()].sort((a,b)=>b.puntos-a.puntos||b.veces-a.veces).slice(0,8),
    srcs:[...fuentes.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10) });
}

function construirPlan(d){
  const { neg, score, srcs, filas, rivales } = d, p = [];
  if(score < 60) p.push({t:t('p1t'), d:t('p1d')(neg.nombre, neg.actividad, neg.ciudad)});
  if(srcs.length) p.push({t:t('p2t')(srcs.slice(0,3).map(s=>s[0]).join(', ')), d:t('p2d')});
  p.push({t:t('p3t'), d:t('p3d')});
  const fall = filas.filter(f=>!f.objetivo).slice(0,2).map(f=>`"${f.q}"`).join(' + ');
  if(fall) p.push({t:t('p4t'), d:t('p4d')(fall)});
  if(rivales.length) p.push({t:t('p5t')(rivales[0].n), d:t('p5d')});
  p.push({t:t('p6t'), d:t('p6d')});
  return p;
}

function contratar(plan, neg, cual){
  // 1) Si hay enlace de pago, cobrar directamente (y arrastrar los datos del
  //    negocio para saber después de quién es cada compra).
  const pago = PAGOS[cual];
  if (pago) {
    const sep = pago.includes('?') ? '&' : '?';
    const ref = encodeURIComponent(neg.nombre + ' · ' + neg.ciudad);
    window.open(pago + sep + 'client_reference_id=' + ref, '_blank', 'noopener');
    return;
  }
  // 2) Si no, abrir conversación con el mensaje ya escrito.
  const txt = t('msg')(neg.nombre, neg.ciudad, plan);
  const url = CONTACTO.whatsapp
    ? `https://wa.me/${CONTACTO.whatsapp}?text=${encodeURIComponent(txt)}`
    : `mailto:${CONTACTO.email}?subject=${encodeURIComponent('CiteMe · '+plan)}&body=${encodeURIComponent(txt)}`;
  window.open(url, '_blank', 'noopener');
}

  $('#err').style.display='none';
  const neg = { nombre:$('#fNombre').value.trim(), ciudad:$('#fCiudad').value.trim(), actividad:$('#fActividad').value.trim() };
  if(!neg.nombre || !neg.ciudad || !neg.actividad) return fallo(t('faltan'));
  if(!BACKEND && !CFG.key){ $('#dlg').showModal(); return fallo(t('needKey')); }
  $('#btnGo').disabled = true;
  try{
    if(!BACKEND && !CFG.model){
      try{ const ms = await detectarModelos(); if(ms.length){ CFG.model = ms[0]; localStorage.setItem(LS.model, CFG.model); } }catch(_){}
    }
    await analizar(neg, parseInt($('#fPreguntas').value,10));
  }catch(e){
    $('#progress').style.display='none'; $('#form').style.display='block';
    fallo(/API 400/.test(e.message) ? t('errKey') : esc(e.message));
  }finally{ $('#btnGo').disabled = false; }
};
aplicarIdioma();
if(location.hash==='#sample' || location.hash==='#ejemplo' || location.hash==='#demo') demo();
</script>
</body>
</html>
